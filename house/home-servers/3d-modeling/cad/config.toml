# config.toml — КОНФІГ корпусу (non-standard параметри = наші рішення дизайну).
# Стандарти (посадка плати mini-ITX, I/O-щиток, 10" рейка Lab-RAX) лишаються
# КОНСТАНТАМИ у params.py — їх не конфігуруємо.
#
# Ідея (31.07): корпус = конструктор. Різні корпуси = різні .toml.
# Активний конфіг — цей файл; або інший через змінну середовища:
#   CORPUS_CONFIG=configs/proxmox.toml .venv/bin/python cad/floor.py
#
# Значення = поточний корпус Proxmox (обкатуємо на ньому модульність).
# Далі сюди приїдуть: [[cutout]] вирізи, типи заповнення по зонах,
# [[unit]] кількість/вміст юнітів (модульний конструктор).

[dimensions]
# Глибина — ПОХІДНА: чистий внутрішній простір + товщина фронт-панелі.
inner_depth   = 213.0   # ЧИСТА глибина: внутр. грань фронт-панелі → зад.
                        #   Драйвер = найглибший компонент (Deep mini-ITX 208,
                        #   SSD+Г-SATA ~210). Загальна = inner_depth + front_panel_t.
front_panel_t = 3.0     # товщина фронт-панелі по Y (і вушок).
body_w        = 221.0   # ширина ТІЛА дна (просвіт 10" Lab-RAX диктує рейка).
ear_overhang  = 16.5    # виступ рейкових вушок за тіло (±).

[thickness]
wall_t   = 3.0          # товщина бічних стінок.
frame_w  = 6.0          # ширина периметрової рами (всередину від краю
                        #   футпринта) = wall_t (3, ПІД стінкою) + 3 виступає.
                        #   31.07: рама — не балка, а посадковий майданчик;
                        #   периметр тримають СТІНКИ (плита 3×88.75 — на
                        #   порядки жорсткіша). ЗАДНЯ кромка (єдина вільна) —
                        #   окремий випадок, вирішимо у Фазі 4.
frame_t  = 3.0          # висота рами = товщина дна на периметрі.
infill_t = 2.0          # товщина заповнення (мембрана сот/ізогріду).
